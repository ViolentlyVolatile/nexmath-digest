<script>
(function(){
"use strict";
var REFRESH_MS = 10 * 60 * 1000, SKEY = "nexmath-dashboard-token";
var subtle = window.crypto && window.crypto.subtle;
var P = JSON.parse(document.getElementById("payload").textContent);
var token = null, lastCheck = 0, pending = false, timer = null;
var $ = function(id){ return document.getElementById(id); };
function unb64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function b64(u){ var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
function store(){ try { return { l: localStorage.getItem(SKEY), s: sessionStorage.getItem(SKEY) }; } catch (e) { return {}; } }
function forget(){ try { localStorage.removeItem(SKEY); sessionStorage.removeItem(SKEY); } catch (e) {} }
function saved(){ var s = store(); var v = s.l || s.s; if (!v) return null; try { var o = JSON.parse(v); return o.salt === P.kdf.salt ? unb64(o.t) : null; } catch (e) { return null; } }
function remember(tok, persist){ forget(); var v = JSON.stringify({ salt: P.kdf.salt, t: b64(tok) }); try { (persist ? localStorage : sessionStorage).setItem(SKEY, v); } catch (e) {} }
async function deriveToken(pw, p){
  var base = await subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(p.kdf.salt), iterations: p.kdf.iter }, base, 256));
}
async function decrypt(tok, p){
  var base = await subtle.importKey("raw", tok, "HKDF", false, ["deriveKey"]);
  var key = await subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: unb64(p.hkdfSalt), info: new TextEncoder().encode(p.hkdf.info) }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await subtle.decrypt({ name: "AES-GCM", iv: unb64(p.iv) }, key, unb64(p.ct)));
}
function istStamp(d){ try { return d.toLocaleString("en-GB", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " IST"; } catch (e) { return d.toISOString(); } }
function istTime(d){ try { return d.toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" }) + " IST"; } catch (e) { return d.toISOString(); } }
function render(html){
  var doc = new DOMParser().parseFromString(html, "text/html");
  var app = $("app"), y = window.scrollY;
  var open = Array.prototype.map.call(app.querySelectorAll("details"), function(d){ return d.open; });
  document.querySelectorAll("style[data-dash]").forEach(function(s){ s.remove(); });
  doc.querySelectorAll("head style").forEach(function(s){ var n = document.createElement("style"); n.setAttribute("data-dash", ""); n.textContent = s.textContent; document.head.appendChild(n); });
  doc.querySelectorAll("script").forEach(function(s){ s.remove(); });
  document.title = doc.title || "Dashboard";
  app.innerHTML = '<div id="dashbar"><span>Published <span id="pub"></span> · auto-refreshes every 10 min · checked <span id="chk"></span></span><a href="#" id="logout">Log out</a></div>' + doc.body.innerHTML;
  $("pub").textContent = istStamp(new Date(P.built));
  app.querySelectorAll("details").forEach(function(d, i){ if (open[i]) d.open = true; });
  $("chk").textContent = istTime(new Date());
  $("logout").addEventListener("click", function(e){ e.preventDefault(); forget(); token = null; location.replace(location.pathname); });
  $("lock").classList.add("hidden"); app.hidden = false;
  if (y) window.scrollTo(0, y);
}
async function unlockWith(tok){ var html = await decrypt(tok, P); token = tok; render(html); schedule(); }
function schedule(){ lastCheck = Date.now(); if (!timer) timer = setInterval(tick, 30 * 1000); }
function tick(){ if (Date.now() - lastCheck >= REFRESH_MS) refresh(); }
async function refresh(){
  if (document.hidden) { pending = true; return; }
  pending = false; lastCheck = Date.now();
  try {
    var r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store", credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var m = (await r.text()).match(/<script type="application\/json" id="payload">([^<]*)<\/script>/);
    if (!m) throw new Error("no payload");
    var np = JSON.parse(m[1]);
    if (np.wv !== P.wv || np.kdf.salt !== P.kdf.salt || np.kdf.iter !== P.kdf.iter) { location.replace(location.pathname + "?t=" + Date.now()); return; }
    if (np.iv !== P.iv) { var html = await decrypt(token, np); P = np; render(html); }
    else $("chk").textContent = istTime(new Date());
  } catch (e) { var c = $("chk"); if (c) c.textContent = istTime(new Date()) + " (offline, retrying)"; }
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden && token && (pending || Date.now() - lastCheck >= REFRESH_MS)) refresh(); });
window.__dashRefresh = refresh;  // manual trigger for testing
$("f").addEventListener("submit", async function(e){
  e.preventDefault();
  var go = $("go"), err = $("err"), pw = $("pw").value;
  if (!subtle) { err.textContent = "This browser cannot decrypt the page (WebCrypto unavailable; use HTTPS)."; return; }
  go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
  try {
    var tok = await deriveToken(pw, P);
    await unlockWith(tok);
    remember(tok, $("rm").checked);
    $("pw").value = "";
  } catch (x) {
    err.textContent = "Wrong password. Please try again.";
    $("pw").select();
  } finally { go.disabled = false; go.textContent = "Unlock"; }
});
if (/[?&]t=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
var s = saved();
if (s && subtle) unlockWith(s).catch(function(){ forget(); });
})();
</script>
